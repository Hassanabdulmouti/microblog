name: CD

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  security:
    uses: ./.github/workflows/security.yml

  cd:
    needs: [ci, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: microblog-image
          path: /tmp
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the image that passed security checks
        env:
          SOURCE_IMAGE: local-microblog:${{ github.sha }}
          RELEASE_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/microblog:${{ github.ref_name }}
        run: |
          docker load -i /tmp/microblog-image.tar
          docker tag "$SOURCE_IMAGE" "$RELEASE_IMAGE"
          docker push "$RELEASE_IMAGE"
