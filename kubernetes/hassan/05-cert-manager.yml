apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: haad23@student.bth.se
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: haad23@student.bth.se
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: microblog-cert
  namespace: microblog
spec:
  secretName: microblog-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: haad23-microblog.northeurope.cloudapp.azure.com
  dnsNames:
    - haad23-microblog.northeurope.cloudapp.azure.com
