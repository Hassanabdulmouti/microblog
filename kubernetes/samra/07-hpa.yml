apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: microblog
  namespace: samra
  labels:
    app.kubernetes.io/name: microblog
    app.kubernetes.io/component: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: microblog
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
