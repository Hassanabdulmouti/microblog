name: CI

on:
  push:
    branches: [master, kmom02, kmom03, kmom04]
  pull_request:
    branches: [master, kmom02, kmom03, kmom04]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          make install-test
      - name: Run checks and tests
        run: make test
