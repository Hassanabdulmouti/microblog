---
-   name: Install Prometheus and Alertmanager
    apt:
        name: "{{ packages }}"
        state: present
        update_cache: yes

-   name: Install Grafana dependencies
    apt:
        name:
            - apt-transport-https
            - software-properties-common
            - wget
        state: present

-   name: Add Grafana GPG key
    apt_key:
        url: https://apt.grafana.com/gpg.key
        state: present

-   name: Add Grafana APT repository
    apt_repository:
        repo: "deb https://apt.grafana.com stable main"
        state: present
        filename: grafana

-   name: Install Grafana
    apt:
        name: grafana
        state: present
        update_cache: yes

-   name: Deploy Prometheus configuration
    template:
        src: prometheus.yml.j2
        dest: /etc/prometheus/prometheus.yml
        mode: "644"
    notify: restart prometheus

-   name: Deploy Prometheus alert rules
    template:
        src: alert_rules.yml.j2
        dest: /etc/prometheus/alert_rules.yml
        mode: "644"
    notify: restart prometheus

-   name: Deploy Alertmanager configuration
    template:
        src: alertmanager.yml.j2
        dest: /etc/prometheus/alertmanager.yml
        mode: "644"
    notify: restart alertmanager

-   name: Deploy Grafana configuration
    template:
        src: grafana.ini.j2
        dest: /etc/grafana/grafana.ini
        mode: "640"
        owner: root
        group: grafana
    notify: restart grafana

-   name: Enable and start Prometheus
    service:
        name: prometheus
        state: started
        enabled: yes

-   name: Enable and start Alertmanager
    service:
        name: prometheus-alertmanager
        state: started
        enabled: yes

-   name: Enable and start Grafana
    service:
        name: grafana-server
        state: started
        enabled: yes

-   name: Wait for Grafana to be ready
    wait_for:
        port: 3000
        host: localhost
        delay: 5
        timeout: 60

-   name: Check if Prometheus datasource already exists
    uri:
        url: "http://localhost:3000/api/datasources/name/Prometheus"
        user: "{{ grafana_admin_user }}"
        password: "{{ grafana_admin_password }}"
        force_basic_auth: yes
        status_code: [200, 404]
    register: grafana_ds_check

-   name: Add Prometheus as Grafana datasource
    uri:
        url: "http://localhost:3000/api/datasources"
        method: POST
        user: "{{ grafana_admin_user }}"
        password: "{{ grafana_admin_password }}"
        force_basic_auth: yes
        body_format: json
        body:
            name: Prometheus
            type: prometheus
            url: "http://localhost:9090"
            access: proxy
            isDefault: true
        status_code: 200
    when: grafana_ds_check.status == 404
