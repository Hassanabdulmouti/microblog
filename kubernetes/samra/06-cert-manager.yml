apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging-samra
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: sama23@student.bth.se
    privateKeySecretRef:
      name: letsencrypt-staging-samra-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-samra
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: sama23@student.bth.se
    privateKeySecretRef:
      name: letsencrypt-prod-samra-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: microblog-tls
  namespace: samra
  labels:
    app.kubernetes.io/name: microblog
    app.kubernetes.io/component: tls
spec:
  secretName: microblog-tls
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: letsencrypt-prod-samra
    kind: ClusterIssuer
  commonName: samra-microblog.northeurope.cloudapp.azure.com
  dnsNames:
    - samra-microblog.northeurope.cloudapp.azure.com
