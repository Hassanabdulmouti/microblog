---
- name: Provision the kmom04 Azure environment
  hosts: local
  connection: local
  gather_facts: false
  tasks:
    - name: Apply the versioned Azure template and write the inventory
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/cloud/provision.py"]
      register: provisioning
      changed_when: true
    - ansible.builtin.debug:
        var: provisioning.stdout_lines
