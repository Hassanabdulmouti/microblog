---
- name: Install application packages
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
    update_cache: true

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: deploy
    group: deploy
    mode: "0755"

- name: Deploy repository revision when no local archive is supplied
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ app_dir }}"
    version: "{{ app_version }}"
  become_user: deploy
  when: app_archive is not defined
  notify: Reload supervisor

- name: Deploy reviewed local snapshot
  ansible.builtin.unarchive:
    src: "{{ app_archive }}"
    dest: "{{ app_dir }}"
    owner: deploy
    group: deploy
  when: app_archive is defined
  notify: Reload supervisor

- name: Install application dependencies
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/requirements.txt"
    virtualenv: "{{ app_dir }}/venv"
    virtualenv_command: python3 -m venv
  become_user: deploy
  notify: Reload supervisor

- name: Install private application configuration
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    mode: "0600"
    owner: deploy
    group: deploy
  no_log: true
  notify: Reload supervisor

- name: Run database migrations
  ansible.builtin.command:
    argv: ["{{ app_dir }}/venv/bin/flask", db, upgrade]
    chdir: "{{ app_dir }}"
  environment:
    FLASK_APP: microblog.py
  become_user: deploy
  run_once: true

- name: Create log directory
  ansible.builtin.file:
    path: /var/log/microblog
    state: directory
    owner: deploy
    group: deploy
    mode: "0750"

- name: Install supervisor configuration
  ansible.builtin.template:
    src: supervisor.conf.j2
    dest: /etc/supervisor/conf.d/microblog.conf
    mode: "0644"
  notify: Reload supervisor

- name: Start supervisor
  ansible.builtin.service:
    name: supervisor
    state: started
    enabled: true
